# 원고 수치 매크로. `dinnno paper numbers`가 이 파일로 writing/numbers.tex를 생성한다. numbers.tex는 손으로 고치지 않는다.
# 항목 하나 = 매크로 하나.
#   macro  : 영문자만 (\ObjAddAucTest 처럼 tex에서 쓴다)
#   source : 프로젝트 루트 기준 원천 파일 (metrics json, 표 md/csv, 로그)
#   key    : 원천 안의 위치. 문법
#              json|dotted.path[,path...]|fmt   정수 경로는 리스트 인덱스, fmt는 "{:.1f}"처럼 값 개수만큼
#              csv|col=val;col=val|column      조건을 모두 만족하는 행이 정확히 하나여야 한다
#              md|행 라벨|열 이름|sel           sel = raw | v (" [" 앞 값) | ci ("[lo, hi]")
#              line|N|substring                N번째 줄에 substring이 그대로 있어야 한다
#   fmt    : (선택) 결과를 float로 바꿔 다시 포맷. 예 "{:.1f}"
#   fact   : (선택) 사실 대장 항목 ID
numbers:
